[project]
name = "ioc-extraction-pipeline"
version = "0.1.0"
description = "Automated IOC extraction and normalization from open threat intelligence feeds"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
]

[project.scripts]
ioc-pipeline = "ioc_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.flake8]
max-line-length = 100
exclude = [".venv", "__pycache__", "dist", "build"]
